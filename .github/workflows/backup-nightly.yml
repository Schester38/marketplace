name: Sauvegarde nocturne

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Installation des dépendances
        run: npm --prefix server install --no-audit --no-fund

      - name: Exécution de la sauvegarde
        run: node server/scripts/backup.mjs
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_UPLOAD_URL: ${{ secrets.BACKUP_UPLOAD_URL }}

      - name: Nettoyage des produits/offres épuisés (quantité = 0)
        run: node server/scripts/cleanup-stockout.mjs
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_STORAGE_BUCKET: photos

      - name: Stockage comme artefact GitHub (90 jours)
        uses: actions/upload-artifact@v7
        with:
          name: sauvegarde-mboppi
          path: _backups/*.ndjson
          if-no-files-found: warn
          retention-days: 90