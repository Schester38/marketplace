name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build client
        working-directory: client
        run: |
          npm install
          npm run build

      - name: Check server syntax
        working-directory: server
        run: |
          npm install
          node -e "import('./app.js').then(() => console.log('server OK'))"
