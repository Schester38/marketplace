<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hors connexion — MboppiShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, "Segoe UI", Arial, sans-serif; }
  </style>
</head>
<body class="min-h-screen text-[#eef4ff] flex items-center justify-center px-4 py-6 overflow-x-hidden" style="background: radial-gradient(1000px 460px at 8% -10%, rgba(37,99,235,0.22), transparent 58%), radial-gradient(820px 420px at 100% 0%, rgba(14,165,233,0.16), transparent 55%), #070d18;">
  <main class="w-full max-w-md">
    <section class="rounded-3xl border p-5 sm:p-6 text-center shadow-2xl" style="background:#0e1728; border-color:#1e2d47; box-shadow:0 18px 50px -30px rgba(0,0,0,0.75);">
      <p class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-sky-300">MboppiShop</p>
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-3xl shadow-lg shadow-blue-900/30">
        📡
      </div>
      <h1 class="text-2xl font-black tracking-tight" style="color:#eef4ff;">Pas de connexion internet</h1>
      <p class="mt-3 text-base leading-relaxed" style="color:#94a3b8;">
        Vous êtes actuellement hors ligne. Vérifiez votre connexion puis réessayez.
      </p>
      <div class="mt-6">
        <button
          onclick="window.location.reload()"
          class="w-full inline-flex items-center justify-center gap-2 rounded-xl px-5 py-3 text-sm font-bold text-white transition duration-200 bg-gradient-to-r from-blue-600 via-blue-600 to-indigo-600 shadow-lg shadow-blue-900/30 hover:-translate-y-0.5 focus:outline-none focus-visible:ring-4 focus-visible:ring-blue-500/25"
        >
          🔄 Réessayer
        </button>
      </div>
      <div class="mt-6 border-t pt-4" style="border-color:#1e2d47;">
        <p class="text-xs tracking-wide" style="color:#64748b;">MboppiShop — votre marché en ligne</p>
      </div>
    </section>
  </main>
</body>
</html>
