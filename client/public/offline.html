<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hors connexion — MboppiShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100 flex items-center justify-center px-6">
  <div class="max-w-md w-full text-center space-y-6">
    <div class="text-7xl">📡</div>
    <h1 class="text-3xl font-extrabold tracking-tight">Pas de connexion internet</h1>
    <p class="text-slate-400 text-base leading-relaxed">
      Vous êtes actuellement hors ligne. Vérifiez votre connexion puis réessayez.
    </p>
    <button
      onclick="window.location.reload()"
      class="inline-flex items-center gap-2 px-8 py-3.5 rounded-full bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-white font-semibold text-base transition-all duration-200 shadow-lg shadow-sky-500/30 hover:shadow-sky-400/40 hover:scale-105"
    >
      🔄 Réessayer
    </button>
    <div class="pt-8 border-t border-slate-700/50">
      <p class="text-slate-500 text-sm">
        MboppiShop — votre marché en ligne
      </p>
    </div>
  </div>
</body>
</html>
