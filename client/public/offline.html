<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hors connexion — MboppiShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center px-6">
  <div class="max-w-md w-full text-center">
    <div class="text-6xl mb-4">📡</div>
    <h1 class="text-2xl font-bold mb-2">Pas de connexion internet</h1>
    <p class="text-slate-400 mb-6">
      Vous êtes actuellement hors ligne. Vérifiez votre connexion puis réessayez.
    </p>
    <button
      onclick="window.location.reload()"
      class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-sky-500 hover:bg-sky-400 text-white font-semibold transition shadow-lg shadow-sky-500/30"
    >
      🔄 Réessayer
    </button>
    <p class="text-slate-500 text-sm mt-8">
      MboppiShop — votre marché en ligne
    </p>
  </div>
</body>
</html>
