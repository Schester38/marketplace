  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#131a22" />
    <meta name="trustpilot-one-time-domain-verification-id" content="66a64808-d642-4e4a-8068-8d6c22baa06e" />
    <link rel="canonical" href="https://mboppi-mboppi.vercel.app/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mboppi" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Mboppi — Boutiques, vendeurs et offres du moment" />
    <meta property="og:description" content="Le marché de votre quartier en ligne : offres du moment, produits des boutiques, vente avec commissions." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mboppi — Boutiques, vendeurs et offres du moment" />
    <meta name="twitter:description" content="Le marché de votre quartier en ligne : offres du moment, produits des boutiques, vente avec commissions." />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mboppi" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script src="/splash.js" defer></script>

    <style>
      .splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(160deg,#f8fafc,#eef2ff);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .splash-logo{width:72px;height:72px;border-radius:18%;animation:splashBounce 1s ease-in-out infinite}
      .splash-spinner{width:36px;height:36px;border:3px solid #ddd6fe;border-top-color:#4f46e5;border-radius:50%;animation:splashSpin .8s linear infinite}
      .splash p{color:#6b7280;font-weight:700;letter-spacing:.5px}
      [data-theme='dark'] .splash{background:linear-gradient(160deg,#0f172a,#1e1b4b)}
      [data-theme='dark'] .splash p{color:#cbd5e1}
      @keyframes splashSpin{to{transform:rotate(360deg)}}
      @keyframes splashBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <img src="/navbar-logo.png" alt="Mboppi" class="splash-logo" />
        <div class="splash-spinner"></div>
        <p>Mboppi</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
